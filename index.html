<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISION SSC GS MASTER PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --primary: #2563eb; }
        .dark { --bg: #090d16; --card: #111827; --text: #f8fafc; --primary: #3b82f6; }
        body { background-color: var(--bg); color: var(--text); transition: 0.3s ease; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
        .card { background-color: var(--card); border: 1px solid rgba(0,0,0,0.05); }
        .sidebar { transition: 0.3s transform; z-index: 1000; }
        .option-btn { width: 100%; text-align: left; padding: 15px; margin: 8px 0; border-radius: 12px; border: 2px solid #e2e8f0; background: var(--card); transition: 0.2s; font-weight: 500; }
        .dark .option-btn { border-color: #1f2937; }
        .correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #166534; }
        .dark .correct { background: rgba(34, 197, 94, 0.15) !important; color: #4ade80; }
        .wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }
        .dark .wrong { background: rgba(239, 68, 68, 0.15) !important; color: #f87171; }
        .explanation-box { background: #eff6ff; border-left: 4px solid #3b82f6; padding: 15px; margin-top: 15px; border-radius: 10px; font-size: 14px; animation: slideIn 0.3s ease; }
        .dark .explanation-box { background: #1e293b; color: #cbd5e1; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .timer-line { transition: width 1s linear; }
    </style>
</head>
<body class="light">

    <audio id="sound-correct" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>
    <audio id="sound-wrong" src="https://assets.mixkit.co/active_storage/sfx/2105/2105-preview.mp3"></audio>

    <div id="sidebar" class="sidebar fixed top-0 left-0 w-72 h-full card shadow-2xl -translate-x-full">
        <div class="p-6 h-full flex flex-col justify-between">
            <div class="space-y-6">
                <h2 class="text-xl font-black text-blue-600 tracking-tighter uppercase">SETTINGS</h2>
                <button onclick="toggleDarkMode()" class="w-full flex items-center justify-between p-3 rounded-xl bg-gray-100 dark:bg-gray-800">
                    <span>Dark Mode</span> <i id="theme-icon" class="fas fa-moon"></i>
                </button>
                <div class="flex items-center justify-between p-3 rounded-xl bg-gray-100 dark:bg-gray-800">
                    <span>Sounds</span>
                    <input type="checkbox" id="soundToggle" checked>
                </div>
                <div>
                    <p class="text-[10px] font-bold text-gray-400 mb-2">Font Size</p>
                    <input type="range" min="14" max="24" value="16" oninput="changeFontSize(this.value)" class="w-full">
                </div>
            </div>
            <button onclick="navigateHome()" class="w-full text-center p-3 font-bold text-blue-600 bg-blue-50 dark:bg-gray-800 rounded-xl"><i class="fas fa-home"></i> Home Screen</button>
        </div>
    </div>
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 hidden z-50"></div>

    <nav class="bg-blue-700 text-white p-4 flex justify-between items-center shadow-lg sticky top-0 z-40">
        <div class="flex items-center gap-4">
            <button onclick="toggleSidebar()"><i class="fas fa-bars-staggered"></i></button>
            <h1 class="font-bold tracking-tight">VISION SSC GS PRO</h1>
        </div>
        <button onclick="toggleLang()" id="langBtn" class="bg-white/20 px-4 py-1 rounded-full text-xs font-bold uppercase">HI</button>
    </nav>

    <div id="main-app" class="max-w-xl mx-auto p-4">
        
        <div id="home-view" class="space-y-6">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 rounded-3xl text-white shadow-xl">
                <h2 class="text-xl font-black mb-1" id="welcome-title">नमस्ते, तैयारी शुरू करें!</h2>
                <p class="text-xs text-blue-100" id="welcome-sub">Vision Coaching Classes - Safalta Ki Nayi Udaan</p>
            </div>
            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 px-1" id="section-title">Exam Categories</h3>
            <div id="categories-grid" class="grid grid-cols-1 gap-4">
                <div id="loading" class="text-center py-20 text-gray-400">Syncing Live Data...</div>
            </div>
        </div>

        <div id="chapter-view" class="hidden">
            <h2 id="chap-title" class="text-lg font-bold mb-4 text-blue-600 border-b pb-2">Chapters</h2>
            <div id="chapter-list" class="space-y-3"></div>
            <button onclick="navigateHome()" class="w-full mt-6 text-gray-400 font-bold text-sm">← Back to Dashboard</button>
        </div>

        <div id="article-view" class="hidden">
            <div class="card p-6 rounded-2xl shadow-xl">
                <h2 id="art-title" class="text-xl font-bold text-blue-600 mb-4 border-b pb-2"></h2>
                <div id="art-body" class="text-sm leading-relaxed whitespace-pre-wrap font-normal text-gray-700 dark:text-gray-300"></div>
                <button onclick="backToChapters()" class="w-full bg-blue-600 text-white p-4 rounded-xl mt-8 font-bold">Back to Chapters</button>
            </div>
        </div>

        <div id="quiz-view" class="hidden">
            <div class="flex justify-between items-center mb-2 px-2">
                <span id="quiz-progress" class="text-xs font-bold opacity-50"></span>
                <div id="timer-badge" class="px-3 py-1 bg-amber-500/10 text-amber-600 dark:text-amber-400 text-xs font-bold rounded-full">
                    <i class="fas fa-clock"></i> <span id="timer-text">30s</span>
                </div>
            </div>
            <div class="card p-6 rounded-3xl shadow-xl min-h-[350px] relative overflow-hidden">
                <div id="visual-timer-bar" class="timer-line absolute top-0 left-0 h-1 bg-amber-500" style="width: 100%"></div>
                <div id="quiz-content" class="mt-2"></div>
                <div id="feedback-area" class="hidden"></div>
            </div>
            <div class="flex gap-4 mt-6">
                <button id="prevBtn" onclick="prevQ()" class="flex-1 bg-gray-200 dark:bg-gray-800 p-4 rounded-xl font-bold opacity-30" disabled>Prev</button>
                <button id="nextBtn" onclick="nextQ()" class="flex-1 bg-blue-600 text-white p-4 rounded-xl font-bold">Next</button>
            </div>
        </div>

        <div id="result-view" class="hidden text-center">
            <div class="card p-10 rounded-[40px] shadow-2xl">
                <h2 class="text-gray-400 font-bold uppercase text-xs mb-2">Final Score</h2>
                <div id="final-score" class="text-6xl font-black text-blue-600 mb-6">0/0</div>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="navigateHome()" class="bg-blue-600 text-white p-4 rounded-2xl font-bold">Restart</button>
                    <button onclick="toggleReview()" class="bg-gray-800 text-white p-4 rounded-2xl font-bold text-sm">Review Ans</button>
                </div>
            </div>
            <div id="review-area" class="hidden mt-6 space-y-4 text-left pb-20"></div>
        </div>
    </div>

    <div id="selection-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-6 z-[100] backdrop-blur-sm">
        <div class="card w-full max-w-sm rounded-[32px] p-8 shadow-2xl text-center relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400"><i class="fas fa-times"></i></button>
            <div class="w-14 h-14 bg-blue-50 text-blue-600 dark:bg-gray-800 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-layer-group text-xl"></i>
            </div>
            <h3 id="modal-cat-name" class="text-xl font-bold mb-1">Category</h3>
            <p class="text-gray-400 text-xs mb-6">Choose your learning mode</p>
            
            <div id="quiz-config-panel" class="mb-4 p-3 bg-gray-50 dark:bg-gray-800/60 rounded-xl text-left hidden">
                <label id="config-label" class="block text-xs font-bold text-gray-500 mb-1.5 uppercase">Question Count Pattern:</label>
                <select id="quizQuestionCount" class="w-full p-2.5 rounded-lg border bg-white dark:bg-gray-900 text-sm font-semibold outline-none border-gray-200 dark:border-gray-700">
                    <option value="25">SSC Official GS Pattern (25 Qs)</option>
                    <option value="5">Quick Practice (5 Qs)</option>
                    <option value="10" selected>Standard Set (10 Qs)</option>
                    <option value="15">Medium Sprint (15 Qs)</option>
                    <option value="20">Mega Drill (20 Qs)</option>
                </select>
            </div>

            <div class="grid gap-3">
                <button onclick="openChapterList()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-bold flex justify-between items-center px-5">
                    <span id="modal-read-btn">📖 Read Article</span> <i class="fas fa-chevron-right text-[10px]"></i>
                </button>
                <button onclick="startQuiz()" class="w-full bg-emerald-600 text-white p-4 rounded-2xl font-bold flex justify-between items-center px-5">
                    <span id="modal-quiz-btn"> 📝 Start Quiz</span> <i class="fas fa-chevron-right text-[10px]"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API = 'https://opensheet.elk.sh/1uDHzIhALnR2zmrK13PXyBeFd9KRcUgkOY4kwu_lYqRs/Sheet1';
        let db = [], curCat = '', activeData = [], userChoices = [], curIdx = 0, lang = 'HI', fs = 16;
        let timerInterval, timeLeft = 30;
        let currentOpenArticleData = null; // Track dynamic reader updates

        window.addEventListener('popstate', function (event) {
            if (event.state) {
                showViewDirectly(event.state.view);
            } else {
                showViewDirectly('home-view');
            }
        });

        function changeState(viewName) {
            history.pushState({ view: viewName }, '', '');
        }

        function showViewDirectly(viewId) {
            clearInterval(timerInterval);
            ['home-view', 'chapter-view', 'article-view', 'quiz-view', 'result-view'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
            if(viewId !== 'article-view') currentOpenArticleData = null;
        }

        fetch(API).then(r => r.json()).then(data => {
            db = data;
            document.getElementById('loading').classList.add('hidden');
            renderHome();
        });

        const categoryTranslation = {
            "History": "इतिहास (History)",
            "Geography": "भूगोल (Geography)",
            "Polity": "भारतीय संविधान (Polity)",
            "Science": "सामान्य विज्ञान (Science)",
            "Physics": "भौतिक विज्ञान (Physics)",
            "Chemistry": "रसायन विज्ञान (Chemistry)",
            "Biology": "जीव विज्ञान (Biology)",
            "Economics": "अर्थशास्त्र (Economics)",
            "Static GK": "विविध सामान्य ज्ञान (Static GK)"
        };

        // UI Fixed: Category wise beautiful iconic maps to fill the white blank boxes
        function getCategoryIcon(cat) {
            const raw = cat.toLowerCase();
            if(raw.includes('history') || raw.includes('इतिहास')) return 'fa-monument text-amber-500';
            if(raw.includes('geo') || raw.includes('भूगोल')) return 'fa-earth-americas text-emerald-500';
            if(raw.includes('polity') || raw.includes('संविधान')) return 'fa-gavel text-indigo-500';
            if(raw.includes('physics') || raw.includes('chemistry') || raw.includes('biology') || raw.includes('science') || raw.includes('विज्ञान')) return 'fa-flask text-purple-500';
            if(raw.includes('eco') || raw.includes('अर्थशास्त्र')) return 'fa-chart-line text-blue-500';
            return 'fa-layer-group text-blue-600';
        }

        function renderHome() {
            const container = document.getElementById('categories-grid'); container.innerHTML = '';
            
            document.getElementById('welcome-title').innerText = lang === 'HI' ? "नमस्ते, तैयारी शुरू करें!" : "Welcome, Start Learning!";
            document.getElementById('welcome-sub').innerText = lang === 'HI' ? "Vision Coaching Classes - Safalta Ki Nayi Udaan" : "Vision Coaching Classes - Your Gateway to Competitive Excellence";
            document.getElementById('section-title').innerText = lang === 'HI' ? "परीक्षा श्रेणियां" : "Exam Categories";

            const cats = [...new Set(db.map(i => i.Category).filter(Boolean))];
            cats.forEach(cat => {
                const displayName = lang === 'HI' ? (categoryTranslation[cat] || cat) : cat;
                const div = document.createElement('div');
                div.className = "card p-5 rounded-2xl flex items-center justify-between cursor-pointer hover:scale-[0.99] transition border-b-4 border-blue-600 shadow-sm";
                div.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-11 h-11 bg-blue-50 dark:bg-gray-800 rounded-xl flex items-center justify-center">
                            <i class="fas ${getCategoryIcon(cat)} text-base"></i>
                        </div>
                        <h3 class="font-extrabold text-sm tracking-tight">${displayName}</h3>
                    </div>
                    <i class="fas fa-chevron-right text-xs opacity-30 text-blue-600"></i>
                `;
                div.onclick = () => { curCat = cat; openSelectionModal(); };
                container.appendChild(div);
            });
        }

        function openSelectionModal() {
            const modalCatDisplay = lang === 'HI' ? (categoryTranslation[curCat] || curCat) : curCat;
            document.getElementById('modal-cat-name').innerText = modalCatDisplay;
            document.getElementById('modal-read-btn').innerText = lang === 'HI' ? "📖 आर्टिकल पढ़ें" : "📖 Read Article";
            document.getElementById('modal-quiz-btn').innerText = lang === 'HI' ? "📝 क्विज शुरू करें" : "📝 Start Quiz";
            
            // Text Configuration Translation UI
            document.getElementById('config-label').innerText = lang === 'HI' ? "प्रश्नों की संख्या चुनें:" : "Question Count Pattern:";
            const selectEl = document.getElementById('quizQuestionCount');
            selectEl.options[0].text = lang === 'HI' ? "SSC ऑफिशियल GS पैटर्न (25 Qs)" : "SSC Official GS Pattern (25 Qs)";
            selectEl.options[1].text = lang === 'HI' ? "त्वरित अभ्यास (5 Qs)" : "Quick Practice (5 Qs)";
            selectEl.options[2].text = lang === 'HI' ? "स्टैंडर्ड सेट (10 Qs)" : "Standard Set (10 Qs)";
            selectEl.options[3].text = lang === 'HI' ? "मध्यम अभ्यास (15 Qs)" : "Medium Sprint (15 Qs)";
            selectEl.options[4].text = lang === 'HI' ? "मेगा ड्रिल सेट (20 Qs)" : "Mega Drill (20 Qs)";

            document.getElementById('quiz-config-panel').classList.remove('hidden');
            document.getElementById('selection-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('selection-modal').classList.add('hidden'); }

        function openChapterList() {
            closeModal();
            changeState('chapter-view');
            showViewDirectly('chapter-view');
            
            const modalCatDisplay = lang === 'HI' ? (categoryTranslation[curCat] || curCat) : curCat;
            document.getElementById('chap-title').innerText = modalCatDisplay;
            
            const list = document.getElementById('chapter-list'); list.innerHTML = '';
            const arts = db.filter(i => i.Category === curCat && i.Type === 'Article').sort((a,b)=>a.Order-b.Order);
            
            arts.forEach(art => {
                const chapterTitle = lang === 'HI' ? art.Chapter : (art.Chapter_EN || art.Chapter);
                const d = document.createElement('div');
                d.className = "card p-4 rounded-xl flex justify-between items-center font-bold text-sm border-l-4 border-amber-500 shadow-sm cursor-pointer";
                d.innerHTML = `<span>${art.Order}. ${chapterTitle}</span> <i class="fas fa-chevron-right text-[10px] opacity-30"></i>`;
                d.onclick = () => openArticle(art);
                list.appendChild(d);
            });
        }

        function openArticle(art) {
            currentOpenArticleData = art; // Saved state globally
            changeState('article-view');
            showViewDirectly('article-view');
            updateArticleUI();
        }

        // Bug Fixed: Interactive engine to refresh reader strings immediately when language button is tapped
        function updateArticleUI() {
            if (!currentOpenArticleData) return;
            const art = currentOpenArticleData;
            document.getElementById('art-title').innerText = lang === 'HI' ? art.Chapter : (art.Chapter_EN || art.Chapter);
            document.getElementById('art-body').innerText = (lang==='HI' ? art.Explanation_HI : art.Explanation_EN || art.Explanation_HI);
        }

        function startQuiz() {
            closeModal();
            changeState('quiz-view');
            showViewDirectly('quiz-view');
            
            // Feature Added: Reading custom options from drop-down module selection
            const chosenCount = parseInt(document.getElementById('quizQuestionCount').value) || 10;
            
            activeData = db.filter(i => i.Category === curCat && i.Type === 'Quiz').sort(()=>0.5-Math.random()).slice(0, chosenCount);
            userChoices = new Array(activeData.length).fill(null);
            curIdx = 0;
            renderQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            document.getElementById('visual-timer-bar').style.width = '100%';
            document.getElementById('timer-text').innerText = `${timeLeft}s`;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-text').innerText = `${timeLeft}s`;
                document.getElementById('visual-timer-bar').style.width = `${(timeLeft / 30) * 100}%`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    autoSubmitWrong();
                }
            }, 1000);
        }

        function autoSubmitWrong() {
            if(userChoices[curIdx]) return;
            const q = activeData[curIdx];
            const isHI = lang === 'HI';
            const cor = isHI ? q.Correct_HI : q.Correct_EN || q.Correct_HI;
            userChoices[curIdx] = { sel: 'TIMEOUT_EXPIRED', cor, exp: isHI ? q.Explanation_HI : q.Explanation_EN, tag: q.Tag, isRight: false };
            if(document.getElementById('soundToggle').checked) {
                document.getElementById('sound-wrong').currentTime = 0;
                document.getElementById('sound-wrong').play();
            }
            renderQuestion();
        }

        function renderQuestion() {
            const q = activeData[curIdx];
            const isHI = lang === 'HI';
            const cor = isHI ? q.Correct_HI : q.Correct_EN || q.Correct_HI;
            const opts = isHI ? [q.Opt1_HI, q.Opt2_HI, q.Opt3_HI, q.Opt4_HI] : [q.Opt1_EN, q.Opt2_EN, q.Opt3_EN, q.Opt4_EN];
            const ans = userChoices[curIdx];

            document.getElementById('quiz-progress').innerText = isHI ? `प्रश्न ${curIdx+1}/${activeData.length}` : `Question ${curIdx+1}/${activeData.length}`;
            
            if(!ans) {
                startTimer();
                document.getElementById('timer-badge').classList.remove('hidden');
                document.getElementById('visual-timer-bar').classList.remove('hidden');
            } else {
                clearInterval(timerInterval);
                document.getElementById('timer-badge').classList.add('hidden');
                document.getElementById('visual-timer-bar').classList.add('hidden');
            }

            document.getElementById('quiz-content').innerHTML = `
                <h2 style="font-size:${fs}px" class="font-bold mb-6">${isHI ? q.Question_HI : q.Question_EN}</h2>
                <div class="space-y-2">
                    ${opts.map(o => {
                        let cls = "";
                        if(ans) {
                            if(o === cor) cls = "correct";
                            else if(o === ans.sel) cls = "wrong";
                        }
                        return `<button class="option-btn ${cls}" onclick="check('${o.replace(/'/g, "\\'")}', '${cor.replace(/'/g, "\\'")}', '${(isHI?q.Explanation_HI:q.Explanation_EN).replace(/'/g, "\\'")}', '${q.Tag}')">${o}</button>`;
                    }).join('')}
                </div>
            `;
            
            const fb = document.getElementById('feedback-area');
            if(ans) {
                fb.innerHTML = `<div class="explanation-box"><b>Explanation:</b><br>${ans.exp}<br><span class="text-[10px] font-bold text-blue-500 mt-2 block">${ans.tag || ''}</span></div>`;
                fb.classList.remove('hidden');
            } else fb.classList.add('hidden');

            document.getElementById('prevBtn').disabled = (curIdx === 0);
            document.getElementById('prevBtn').style.opacity = (curIdx === 0) ? 0.3 : 1;
        }

        function check(sel, cor, exp, tag) {
            if(userChoices[curIdx]) return;
            clearInterval(timerInterval);
            const right = (sel === cor);
            userChoices[curIdx] = { sel, cor, exp, tag, isRight: right };
            if(document.getElementById('soundToggle').checked) {
                const s = document.getElementById(right ? 'sound-correct' : 'sound-wrong');
                s.currentTime = 0; s.play();
            }
            renderQuestion();
        }

        function nextQ() { curIdx < activeData.length - 1 ? (curIdx++, renderQuestion()) : finish(); }
        function prevQ() { if(curIdx > 0) { curIdx--; renderQuestion(); } }

        function finish() {
            changeState('result-view');
            showViewDirectly('result-view');
            const score = userChoices.filter(u => u?.isRight).length;
            document.getElementById('final-score').innerText = `${score}/${activeData.length}`;
        }

        function toggleReview() {
            const area = document.getElementById('review-area'); area.classList.toggle('hidden');
            area.innerHTML = userChoices.map((u, i) => `
                <div class="card p-4 rounded-xl border-l-4 ${u?.isRight ? 'border-green-500' : 'border-red-500'}">
                    <p class="font-bold text-sm">${lang==='HI' ? activeData[i].Question_HI : activeData[i].Question_EN}</p>
                    <p class="text-xs text-green-600 mt-1">Ans: ${u?.cor}</p>
                </div>
            `).join('');
        }

        function toggleLang() { 
            lang = (lang === 'HI' ? 'EN' : 'HI'); 
            document.getElementById('langBtn').innerText = lang;
            
            if(!document.getElementById('home-view').classList.contains('hidden')) renderHome();
            if(!document.getElementById('quiz-view').classList.contains('hidden')) renderQuestion();
            if(!document.getElementById('chapter-view').classList.contains('hidden')) openChapterList();
            if(!document.getElementById('article-view').classList.contains('hidden')) updateArticleUI(); // Realtime sync update fix
        }

        function navigateHome() {
            clearInterval(timerInterval);
            showViewDirectly('home-view');
            renderHome();
        }

        function backToChapters() {
            showViewDirectly('chapter-view');
            openChapterList();
        }

        function toggleDarkMode() { document.body.classList.toggle('dark'); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('overlay').classList.toggle('hidden'); }
        function changeFontSize(v) { fs = v; if(!document.getElementById('quiz-view').classList.contains('hidden')) renderQuestion(); }
    </script>
</body>
</html>
